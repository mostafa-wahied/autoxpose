name: Auto Tag on Version Change

on:
  workflow_call:

jobs:
  auto-tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout qualified source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download qualification receipt
        uses: actions/download-artifact@v4
        with:
          name: qualified-release
          path: ${{ runner.temp }}

      - name: Announce qualified version
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/autoxpose
        run: node scripts/release.mjs announce

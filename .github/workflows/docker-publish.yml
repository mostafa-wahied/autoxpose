name: Build and Publish Docker Image

on:
  push:
    branches: ['main']
    tags: ['v*.*.*']
  pull_request:
    branches: ['main']

env:
  IMAGE_NAME: autoxpose

jobs:
  build-and-push:
    name: Build and test (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ github.event_name == 'pull_request' && env.IMAGE_NAME || format('{0}/{1}', secrets.DOCKERHUB_USERNAME, env.IMAGE_NAME) }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: autoxpose:test
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=${{ matrix.architecture }}
          platforms: linux/${{ matrix.architecture }}

      - name: Verify native database binding
        env:
          EXPECTED_IMAGE: ${{ steps.build.outputs.imageid }}
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          docker run --rm --network none --entrypoint node \
            --env EXPECTED_ARCHITECTURE "$EXPECTED_IMAGE" -e "
              const assert = require('node:assert/strict');
              const expectedArchitecture = { amd64: 'x64', arm64: 'arm64' }[process.env.EXPECTED_ARCHITECTURE];
              assert.equal(process.platform, 'linux');
              assert.equal(process.arch, expectedArchitecture);
              const Database = require('better-sqlite3');
              const database = new Database(':memory:');
              try {
                assert.equal(database.prepare('SELECT 1 AS value').get().value, 1);
                assert.equal(database.pragma('quick_check', { simple: true }), 'ok');
              } finally {
                database.close();
              }
            "

      - name: Test Docker image
        env:
          EXPECTED_IMAGE: ${{ steps.build.outputs.imageid }}
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          test "$(docker image inspect autoxpose:test --format '{{.Id}}')" = "$EXPECTED_IMAGE"
          test "$(docker image inspect autoxpose:test --format '{{.Architecture}}')" = "$EXPECTED_ARCHITECTURE"
          expected_version=$(jq -r '.version' package.json)
          test "$(docker run --rm --entrypoint node "$EXPECTED_IMAGE" -p "require('/app/package.json').version")" = "$expected_version"

          docker run -d --name test-autoxpose \
            -p 127.0.0.1:3000:3000 \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            -e SERVER_IP=127.0.0.1 \
            -e LAN_IP=127.0.0.1 \
            "$EXPECTED_IMAGE"

          curl --fail --silent --show-error --retry 30 --retry-delay 1 \
            --retry-all-errors --max-time 5 --retry-max-time 60 \
            --output "$RUNNER_TEMP/autoxpose-health.json" \
            http://127.0.0.1:3000/health
          jq -e '.status == "ok"' "$RUNNER_TEMP/autoxpose-health.json"
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:3000/ > /dev/null
          test "$(docker inspect test-autoxpose --format '{{.Image}}')" = "$EXPECTED_IMAGE"
          docker exec test-autoxpose node -e "const assert = require('node:assert/strict'); const fs = require('node:fs'); assert.match(fs.readFileSync('/proc/1/status', 'utf8'), /^Uid:\\s+1001\\s+1001\\s+1001\\s+1001$/m);"

      - name: Push tested platform image
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/${{ matrix.architecture }}
          outputs: type=image,name=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Verify and record platform digest
        if: github.event_name != 'pull_request'
        env:
          TESTED_IMAGE: ${{ steps.build.outputs.imageid }}
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          manifest_file="$RUNNER_TEMP/pushed-platform.json"
          docker buildx imagetools inspect --raw "$IMAGE@$IMAGE_DIGEST" > "$manifest_file"
          if jq -e 'has("manifests")' "$manifest_file" > /dev/null; then
            platform_digest=$(jq -er --arg architecture "$ARCHITECTURE" '
              [.manifests[] | select(.platform.os == "linux" and .platform.architecture == $architecture)]
              | if length == 1 then .[0].digest else error("Expected one matching platform") end
            ' "$manifest_file")
            [[ "$platform_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            docker buildx imagetools inspect --raw "$IMAGE@$platform_digest" > "$manifest_file"
          fi
          config_digest=$(jq -er '.config.digest' "$manifest_file")
          test "$config_digest" = "$TESTED_IMAGE"
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\n' "$IMAGE_DIGEST" > "$RUNNER_TEMP/digests/$ARCHITECTURE"

      - name: Upload platform digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.architecture }}
          path: ${{ runner.temp }}/digests/${{ matrix.architecture }}
          if-no-files-found: error
          retention-days: 1

      - name: Clean up test container
        if: always()
        run: |
          if docker container inspect test-autoxpose > /dev/null 2>&1; then
            docker logs test-autoxpose
            docker rm --force test-autoxpose
          fi

  publish:
    name: Publish multi-platform image
    needs: build-and-push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Download platform digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Publish verified platform manifests
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          METADATA: ${{ steps.meta.outputs.json }}
        run: |
          sources=()
          for architecture in amd64 arm64; do
            digest=$(cat "$RUNNER_TEMP/digests/$architecture")
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            sources+=("$IMAGE@$digest")
          done
          docker buildx imagetools create --dry-run "${sources[@]}" > "$RUNNER_TEMP/manifest.json"
          jq -e '([.manifests[] | select(.platform.os == "linux") | .platform.architecture] | sort) == ["amd64", "arm64"]' "$RUNNER_TEMP/manifest.json"
          mapfile -t tags < <(jq -er '.tags[]' <<< "$METADATA")
          test "${#tags[@]}" -gt 0
          tag_arguments=()
          for tag in "${tags[@]}"; do
            [[ "$tag" == "$IMAGE:"* ]]
            tag_arguments+=(--tag "$tag")
          done
          docker buildx imagetools create "${tag_arguments[@]}" "${sources[@]}"
